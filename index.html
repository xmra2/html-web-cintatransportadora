<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Clasificación de Tapitas por Color</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <div class="hud" id="hud-panel">
    <div class="hud-header" id="hud-header">
      <div class="hud-title-group">
        <h1>CLASIFICADOR DE TAPITAS</h1>
        <div class="sub">Etapa 2 — simulación física completa</div>
      </div>
      <div class="hud-header-actions">
        <button id="playpause-mini" class="mini-btn mini-btn--play" aria-label="Pausar/Iniciar">
          <span class="mini-btn-icon"></span>
        </button>
        <button id="hud-toggle" class="hud-toggle-btn" aria-expanded="true" aria-controls="hud-body" aria-label="Mostrar/ocultar panel">
          <span class="hud-toggle-icon"></span>
        </button>
      </div>
    </div>

    <div class="hud-body" id="hud-body">
      <div class="ctrl-row">
        <button id="playpause-btn" class="ctrl-btn ctrl-btn--primary">▶ Iniciar</button>
        <button id="reset-btn" class="ctrl-btn">⟲ Reiniciar</button>
      </div>

      <div id="detected-color" class="detected">COLOR DETECTADO: —</div>

      <div class="bin-row">
        <span class="dot dot-left"></span>
        <span class="name" id="label-left">Izquierda</span>
        <span class="value" id="count-left">0</span>
      </div>
      <div class="bin-row">
        <span class="dot dot-center"></span>
        <span class="name" id="label-center">Centro</span>
        <span class="value" id="count-center">0</span>
      </div>
      <div class="bin-row">
        <span class="dot dot-right"></span>
        <span class="name" id="label-right">Derecha</span>
        <span class="value" id="count-right">0</span>
      </div>
      <div class="bin-row bin-row--total">
        <span class="name">Total clasificadas</span>
        <span class="value" id="count-total">0</span>
      </div>

      <div class="collapsible">
        <button class="collapsible-header" id="speed-toggle" aria-expanded="true" aria-controls="speed-body">
          <span>Velocidad</span>
          <span class="chevron"></span>
        </button>
        <div class="collapsible-body" id="speed-body">
          <div class="speed-row">
            <input type="range" id="speed-slider" min="0.4" max="2.5" step="0.1" value="1" />
            <span class="speed-value" id="speed-value">1.0×</span>
          </div>
        </div>
      </div>

      <div class="collapsible">
        <button class="collapsible-header" id="feed-toggle" aria-expanded="true" aria-controls="feed-body">
          <span>Cola de entrada (<span id="queue-length">0</span> esperando)</span>
          <span class="chevron"></span>
        </button>
        <div class="collapsible-body" id="feed-body">
          <div class="btn-row">
            <button class="cap-btn cap-btn--red" data-add-color="red">+ Roja</button>
            <button class="cap-btn cap-btn--green" data-add-color="green">+ Verde</button>
            <button class="cap-btn cap-btn--blue" data-add-color="blue">+ Azul</button>
          </div>

          <div class="section-title">Secuencia rápida</div>
          <div class="seq-row">
            <input id="sequence-input" type="text" placeholder="rojo,verde,azul,rojo" />
            <button id="sequence-add">Agregar</button>
          </div>

          <label class="toggle-row">
            <input type="checkbox" id="auto-toggle" checked />
            Alimentación automática
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="hint">Click + arrastrar: orbitar · Scroll: zoom</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
